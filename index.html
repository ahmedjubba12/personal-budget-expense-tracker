<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Budget Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header id="page-header">
        <h1>My Budget Tracker</h1>
        <p>Track your income and expenses in one place.</p>
    </header>

    <main>
        <section class="expense-form-section" aria-labelledby="add-expense-heading">
            <h2 id="add-expense-heading">Add Expense</h2>

            <div class="form-fields">
                <label for="expense-name">Expense name</label>
                <input
                    type="text"
                    id="expense-name"
                    name="expense-name"
                    placeholder="e.g. Groceries"
                >

                <label for="expense-amount">Amount (KES)</label>
                <input
                    type="number"
                    id="expense-amount"
                    name="expense-amount"
                    placeholder="e.g. 1500"
                    min="0"
                    step="0.01"
                >

                <label for="expense-category">Category</label>
                <select id="expense-category" name="expense-category">
                    <option value="">Select a category</option>
                    <option value="food">Food</option>
                    <option value="transport">Transport</option>
                    <option value="bills">Bills</option>
                    <option value="education">Education</option>
                    <option value="other">Other</option>
                </select>
            </div>
        </section>

        <section class="expenses-section" aria-labelledby="your-expenses-heading">
            <h2 id="your-expenses-heading">Your Expenses</h2>
            <p id="empty-message">No expenses yet. Your expenses will appear here.</p>
        </section>
    </main>
</body>
</html>
